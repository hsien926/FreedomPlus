# YAML · build.yml · GitHub Actions / JDK 17 / Android SDK 34 · 只读测试与编译
name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPILE_SDK: '34'
  BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Test and verify debug / unsigned release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" > /dev/null
          echo "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install APK verifier
        run: python -m pip install --disable-pip-version-check androguard==4.1.4
      - name: Read expected version
        id: version
        run: |
          set -euo pipefail
          suffix="${GITHUB_SHA:0:12}"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          python tools/verify_ci_apk.py --print-version --suffix "${suffix}" >> "$GITHUB_OUTPUT"
      - name: Run regression tests and assemble
        run: |
          set -euo pipefail
          test ! -f keystore.properties
          python -m unittest discover -s tools -p 'test_*.py'
          chmod +x gradlew
          ./gradlew :core:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            -PversionSuffix="${{ steps.version.outputs.suffix }}" --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Verify metadata, signatures and DEX
        run: |
          set -euo pipefail
          mkdir -p ci-verification
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          test "${#debug_apks[@]}" -eq 1
          test "${#release_apks[@]}" -eq 1
          apksigner verify --verbose "${debug_apks[0]}"
          if apksigner verify "${release_apks[0]}" > /dev/null 2>&1; then
            echo '::error::CI release 应为未签名验证产物'
            exit 1
          fi
          python tools/verify_ci_apk.py --suffix "${{ steps.version.outputs.suffix }}" \
            --apk "${debug_apks[0]}" --out ci-verification/debug.json
          python tools/verify_ci_apk.py --suffix "${{ steps.version.outputs.suffix }}" \
            --apk "${release_apks[0]}" --mapping app/build/outputs/mapping/release/mapping.txt \
            --out ci-verification/release.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## 验证产物（不是正式发布）\n')
          print('| 变体 | 版本 | 字节 | SHA-256 |\n|---|---|---:|---|')
          for variant in ('debug', 'release'):
              data = json.loads(Path(f'ci-verification/{variant}.json').read_text())
              print(f"| {variant} | {data['version_name']} ({data['version_code']}) | {data['bytes']} | `{data['sha256']}` |")
          print('\nRelease 未签名；不自动创建 Release，不使用正式签名 Secrets。')
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-tests-${{ github.sha }}
          path: |
            core/build/test-results/testDebugUnitTest/*.xml
            core/build/reports/tests/testDebugUnitTest/**
            ci-verification/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
