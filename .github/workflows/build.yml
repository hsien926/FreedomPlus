name: Build

# 触发方式：
#   1. 在 Actions 页面手动运行（workflow_dispatch）
#   2. 推送到 main 分支
#   3. 推送 v* 标签（tag 构建会额外发布 GitHub Release）
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# 创建 Release 需要写权限，其余操作默认只读
permissions:
  contents: write

# 分支构建允许互相取消，tag 发布不打断
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  COMPILE_SDK: '34'
  BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Assemble debug & release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kotlin 1.8.10 与 AGP 8.5.0 均要求 JDK 17，JDK 21 会导致编译失败
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 只装 cmdline-tools 与 platform-tools；platform / build-tools 在下一步显式安装
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK platforms & build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" > /dev/null
          echo "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      # 缓存 Gradle wrapper 发行包、依赖与 build cache
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 复用 app/build.gradle 的现有机制：只有在工程根存在 keystore.properties
      # 且 storeFile 指向真实密钥库时，release 才会被签名。
      - name: Prepare signing config
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::标签构建必须签名。请在 Settings → Secrets and variables → Actions 中配置 KEYSTORE_BASE64、KEYSTORE_STORE_PASSWORD、KEYSTORE_KEY_ALIAS、KEYSTORE_KEY_PASSWORD 后重跑。"
              exit 1
            fi
            echo "::warning::未配置 KEYSTORE_BASE64，release 将产出未签名 APK（仅供编译验证，无法直接安装）。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${KEYSTORE_STORE_PASSWORD:-}" ] || [ -z "${KEYSTORE_KEY_ALIAS:-}" ] || [ -z "${KEYSTORE_KEY_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_BASE64 已配置，但 KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_ALIAS / KEYSTORE_KEY_PASSWORD 不完整。"
            exit 1
          fi

          # Secrets 只能是文本，故密钥库存为 base64；此处还原为工程根下的 release.jks
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_STORE_PASSWORD}"
            echo "keyAlias=${KEYSTORE_KEY_ALIAS}"
            echo "keyPassword=${KEYSTORE_KEY_PASSWORD}"
          } > keystore.properties

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "密钥库已还原，release 将使用正式密钥签名"

      # 防止 v1.4.0 的标签发出 1.3.9 的包
      - name: Check tag against versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          apk_version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          echo "tag=${GITHUB_REF_NAME} -> ${tag_version} / versionName=${apk_version}"
          if [ "${tag_version}" != "${apk_version}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 app/build.gradle 的 versionName=${apk_version} 不一致，请先同步 versionCode/versionName 再打标签。"
            exit 1
          fi

      - name: Assemble debug & release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Verify artifacts
        run: |
          set -euo pipefail

          debug_apk="$(ls -1 app/build/outputs/apk/debug/*.apk | head -n 1)"
          release_apk="$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "debug=${debug_apk}"
          echo "release=${release_apk}"

          {
            echo "## 构建产物"
            echo
            echo "| 变体 | 文件 | 大小 | SHA-256 |"
            echo "|---|---|---|---|"
            for variant in debug release; do
              for apk in app/build/outputs/apk/"${variant}"/*.apk; do
                size="$(du -h "${apk}" | cut -f1)"
                sha="$(sha256sum "${apk}" | cut -d' ' -f1)"
                echo "| ${variant} | $(basename "${apk}") | ${size} | \`${sha}\` |"
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # 用 sed 而非 head 截取，避免 aapt 写入已被关闭的管道触发 SIGPIPE（pipefail 下会判失败）
          echo "--- badging ---"
          aapt dump badging "${debug_apk}" | sed -n '1p'
          aapt dump badging "${release_apk}" | sed -n '1p'

          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "--- signature ---"
            apksigner verify --print-certs -v "${release_apk}"
          else
            echo "::notice::release 未签名，跳过 apksigner 校验"
          fi

          # 混淆后入口类必须存活，否则 LSPosed 无法加载模块
          entry="$(unzip -p "${release_apk}" assets/xposed_init | tr -d '\r\n')"
          echo "assets/xposed_init=${entry}"
          if [ "${entry}" != "io.github.fplus.HookInit" ]; then
            echo "::error::release 包内 assets/xposed_init 内容异常（期望 io.github.fplus.HookInit，实际 '${entry}'），请检查 proguard 规则。"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: freedomplus-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # 仅 tag 构建发布 Release；debug 包与 release 包同名，故只挂 release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
